[project]
name = "llm-journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahavir Singh Rajpurohit", email = "you@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[project.scripts]
llm-journey = "llm_journey:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
